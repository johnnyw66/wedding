<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Planner: Professional Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { background-color: #f1f5f9; font-family: sans-serif; overflow-x: hidden; }
        .floor-canvas { 
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 30px 30px;
            height: 70vh;
            position: relative;
            border: 2px solid #cbd5e1;
            border-radius: 12px;
            background-color: #f8fafc;
            touch-action: none;
        }
        .draggable-table { cursor: grab; user-select: none; touch-action: none; }
        .draggable-table:active { cursor: grabbing; }
        
        .guest-dropdown {
            animation: slideDown 0.2s ease-out;
            pointer-events: none;
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px) translateX(-50%); }
            to { opacity: 1; transform: translateY(0) translateX(-50%); }
        }
        
        /* Custom scrollbar for guest detail lists */
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // FIXED STORAGE KEYS - Do not change these to preserve data across updates
        const STORAGE_KEY_LAYOUT = 'wedding_planner_persistent_layout';
        const STORAGE_KEY_MENU = 'wedding_planner_persistent_menu';

        const TableVisual = ({ table, size = "large" }) => {
            const guests = table.guests || [];
            const isSmall = size === "small";
            const radius = isSmall ? 40 : 75; 
            const centerX = isSmall ? 50 : 100;
            const centerY = isSmall ? 50 : 100;

            return (
                <div className={`relative ${isSmall ? 'w-24 h-24' : 'w-52 h-52'} bg-white rounded-full border-2 border-dashed border-slate-300 flex items-center justify-center shadow-md`}>
                    <div className={`${isSmall ? 'w-12 h-12 text-[10px]' : 'w-24 h-24 text-base'} bg-slate-100 rounded-full shadow-inner flex items-center justify-center z-10 border border-slate-200`}>
                        <span className="font-bold text-slate-600">T{table.id}</span>
                    </div>

                    {guests.map((guest, index) => {
                        const angle = (index / guests.length) * 2 * Math.PI - Math.PI / 2;
                        const x = centerX + radius * Math.cos(angle);
                        const y = centerY + radius * Math.sin(angle);
                        
                        return (
                            <div key={index} className="absolute transform -translate-x-1/2 -translate-y-1/2 z-20" style={{ left: `${x}px`, top: `${y}px` }}>
                                {!isSmall ? (
                                    <div className="bg-blue-600 text-white px-2 py-0.5 rounded text-[9px] font-semibold shadow-sm whitespace-nowrap">
                                        {guest.name}
                                    </div>
                                ) : (
                                    <div className="w-2 h-2 bg-blue-400 rounded-full border border-white"></div>
                                )}
                            </div>
                        );
                    })}
                </div>
            );
        };

        const App = () => {
            const [view, setView] = useState('input');
            const [hoveredId, setHoveredId] = useState(null);
            const [draggingId, setDraggingId] = useState(null);
            const canvasRef = useRef(null);

            const [menu, setMenu] = useState(() => {
                const saved = localStorage.getItem(STORAGE_KEY_MENU);
                return saved ? JSON.parse(saved) : { starters: [""], mains: [""], desserts: [""] };
            });

            const [tables, setTables] = useState(() => {
                const saved = localStorage.getItem(STORAGE_KEY_LAYOUT);
                if (saved) return JSON.parse(saved);
                return Array.from({ length: 6 }, (_, i) => ({ 
                    id: i + 1, 
                    guests: [], 
                    x: 20 + (i * 130) % 600, 
                    y: 20 + Math.floor(i / 3) * 150 
                }));
            });

            useEffect(() => {
                localStorage.setItem(STORAGE_KEY_LAYOUT, JSON.stringify(tables));
            }, [tables]);

            useEffect(() => {
                localStorage.setItem(STORAGE_KEY_MENU, JSON.stringify(menu));
            }, [menu]);

            const handleNameStringChange = (tableId, val) => {
                const names = val.split(',').map(n => n.trim());
                setTables(prev => prev.map(t => {
                    if (t.id !== tableId) return t;
                    // Reconciliation: Match by index to preserve meal data
                    const updatedGuests = names.map((name, i) => {
                        const existing = t.guests[i];
                        return {
                            name: name,
                            starter: existing?.starter || "",
                            main: existing?.main || "",
                            dessert: existing?.dessert || "",
                            dietary: existing?.dietary || ""
                        };
                    }).filter((g, i) => i < names.length);
                    return { ...t, guests: updatedGuests };
                }));
            };

            const updateGuest = (tableId, gIndex, field, val) => {
                setTables(prev => prev.map(t => {
                    if (t.id !== tableId) return t;
                    const updated = [...t.guests];
                    updated[gIndex] = { ...updated[gIndex], [field]: val };
                    return { ...t, guests: updated };
                }));
            };

            const handlePointerMove = (e) => {
                if (draggingId === null) return;
                const rect = canvasRef.current.getBoundingClientRect();
                setTables(prev => prev.map(t => t.id === draggingId ? { ...t, x: e.clientX - rect.left - 48, y: e.clientY - rect.top - 48 } : t));
            };

            return (
                <div className="p-6 max-w-7xl mx-auto h-screen flex flex-col">
                    <header className="flex justify-between items-center mb-6">
                        <div className="flex items-center gap-3">
                            <div className="p-2 bg-blue-600 rounded-lg text-white">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 12h.01"/><path d="M15 12h.01"/><path d="M10 16c.5.3 1.2.5 2 .5s1.5-.2 2-.5"/><path d="M19 10c0-3.9-3.1-7-7-7s-7 3.1-7 7c0 .7.1 1.4.3 2.1C3.8 13.3 3 15.1 3 17a5 5 0 0 0 5 5h8a5 5 0 0 0 5-5c0-1.9-.8-3.7-2.3-4.9.2-.7.3-1.4.3-2.1Z"/></svg>
                            </div>
                            <h1 className="text-2xl font-bold text-slate-800 font-serif tracking-tight">Wedding Planner</h1>
                        </div>
                        <div className="flex bg-slate-200 p-1 rounded-xl shadow-inner">
                            {['input', 'menu', 'plan'].map(v => (
                                <button 
                                    key={v} 
                                    onClick={() => setView(v)} 
                                    className={`px-6 py-2 rounded-lg text-xs font-black uppercase transition-all duration-200 ${view === v ? 'bg-white shadow-md text-blue-600 translate-y-[-1px]' : 'text-slate-500 hover:text-slate-700'}`}
                                >
                                    {v === 'input' ? 'Guests' : v === 'menu' ? 'Menu' : 'Floor Plan'}
                                </button>
                            ))}
                        </div>
                    </header>

                    {view === 'menu' && (
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6 animate-in slide-in-from-bottom-2 duration-300">
                            {['starters', 'mains', 'desserts'].map(cat => (
                                <div key={cat} className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                                    <h2 className="capitalize font-black text-slate-400 text-[10px] tracking-widest mb-4 border-b border-slate-100 pb-2">{cat}</h2>
                                    {menu[cat].map((item, i) => (
                                        <input 
                                            key={i} 
                                            className="w-full p-2.5 border border-slate-200 rounded-lg mb-2 text-sm focus:ring-2 focus:ring-blue-100 focus:border-blue-400 outline-none transition-all" 
                                            value={item} 
                                            onChange={(e) => {
                                                const next = [...menu[cat]]; next[i] = e.target.value;
                                                setMenu({...menu, [cat]: next});
                                            }}
                                            placeholder={`Option ${i+1}...`}
                                        />
                                    ))}
                                    <button 
                                        onClick={() => setMenu({...menu, [cat]: [...menu[cat], ""]})} 
                                        className="w-full py-2 bg-slate-50 text-blue-600 text-[10px] font-bold rounded-lg border border-dashed border-slate-300 hover:bg-white transition-colors"
                                    >
                                        + ADD {cat.toUpperCase()}
                                    </button>
                                </div>
                            ))}
                        </div>
                    )}

                    {view === 'input' && (
                        <div className="flex-1 overflow-y-auto space-y-8 pb-20 px-1 custom-scroll">
                            {tables.map(table => (
                                <div key={table.id} className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm grid grid-cols-1 lg:grid-cols-3 gap-10">
                                    <div className="lg:col-span-1 border-r border-slate-100 pr-8">
                                        <div className="flex justify-between items-center mb-4">
                                            <h2 className="font-bold text-xl text-slate-800">Table {table.id}</h2>
                                            <span className="bg-blue-50 text-blue-600 text-[10px] font-bold px-2 py-1 rounded-full uppercase">{table.guests.filter(g => g.name).length} Seats</span>
                                        </div>
                                        <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-2">Guest List (Names with commas)</label>
                                        <textarea 
                                            className="w-full p-4 border border-slate-200 rounded-xl h-36 text-sm focus:ring-4 focus:ring-blue-50 outline-none bg-slate-50 transition-all font-medium"
                                            value={table.guests.map(g => g.name).join(', ')}
                                            onChange={(e) => handleNameStringChange(table.id, e.target.value)}
                                            placeholder="Alice, Bob, Charlie..."
                                        />
                                        <div className="flex justify-center mt-8">
                                            <TableVisual table={table} />
                                        </div>
                                    </div>
                                    <div className="lg:col-span-2 space-y-3">
                                        <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-2">Meal Selection & Notes</label>
                                        <div className="space-y-2 max-h-[500px] overflow-y-auto pr-2 custom-scroll">
                                            {table.guests.map((g, i) => (
                                                <div key={i} className="flex flex-wrap md:flex-nowrap gap-3 items-center bg-white p-3 rounded-xl border border-slate-100 shadow-sm hover:border-blue-200 transition-all">
                                                    <span className="w-full md:w-32 text-[12px] font-bold text-slate-700 truncate">{g.name || `Guest ${i+1}`}</span>
                                                    <div className="flex gap-2 flex-1 min-w-[300px]">
                                                        {['starter', 'main', 'dessert'].map(course => (
                                                            <select 
                                                                key={course} 
                                                                className="flex-1 text-[11px] p-2 border border-slate-200 rounded-lg bg-slate-50 cursor-pointer" 
                                                                value={g[course]} 
                                                                onChange={(e) => updateGuest(table.id, i, course, e.target.value)}
                                                            >
                                                                <option value="">{course.charAt(0).toUpperCase() + course.slice(1)}</option>
                                                                {menu[course + 's'].filter(m => m).map(m => <option key={m} value={m}>{m}</option>)}
                                                            </select>
                                                        ))}
                                                    </div>
                                                    <input 
                                                        className="w-full md:w-48 text-[11px] p-2 border border-slate-200 rounded-lg bg-slate-50 focus:bg-red-50 focus:border-red-200 outline-none transition-colors" 
                                                        placeholder="Allergies / Dietary..." 
                                                        value={g.dietary} 
                                                        onChange={(e) => updateGuest(table.id, i, 'dietary', e.target.value)}
                                                    />
                                                </div>
                                            ))}
                                            {table.guests.length === 0 && <div className="text-slate-300 text-sm italic py-10 text-center border-2 border-dashed rounded-xl">Enter names in the box to begin.</div>}
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}

                    {view === 'plan' && (
                        <div className="flex-1 relative animate-in zoom-in-95 duration-300">
                            <div 
                                ref={canvasRef} 
                                className="floor-canvas shadow-inner" 
                                onPointerMove={handlePointerMove} 
                                onPointerUp={() => setDraggingId(null)}
                                onPointerLeave={() => {setDraggingId(null); setHoveredId(null)}}
                            >
                                {tables.map(table => (
                                    <div key={table.id} 
                                        onPointerDown={() => setDraggingId(table.id)}
                                        onMouseEnter={() => !draggingId && setHoveredId(table.id)}
                                        onMouseLeave={() => setHoveredId(null)}
                                        className="absolute draggable-table" 
                                        style={{ left: `${table.x}px`, top: `${table.y}px`, zIndex: hoveredId === table.id ? 100 : 10 }}
                                    >
                                        {/* POP-UP NOW APPEARS BELOW TABLE */}
                                        {hoveredId === table.id && table.guests.length > 0 && table.guests.some(g => g.name) && (
                                            <div className="guest-dropdown absolute top-full left-1/2 mt-3 w-72 bg-slate-900 text-white rounded-2xl p-4 z-[110] shadow-2xl ring-1 ring-white/10">
                                                <div className="absolute w-3 h-3 bg-slate-900 rotate-45 left-1/2 -top-1.5 -translate-x-1/2"></div>
                                                <div className="text-[10px] text-slate-500 uppercase font-black tracking-widest border-b border-slate-800 mb-3 pb-2 relative z-10">Table {table.id} Seating</div>
                                                <div className="space-y-3 relative z-10">
                                                    {table.guests.filter(g => g.name).map((g, i) => (
                                                        <div key={i} className="text-[11px] border-b border-slate-800 pb-2 last:border-0">
                                                            <div className="font-bold text-blue-400 mb-0.5">{g.name}</div>
                                                            <div className="text-slate-400 flex flex-wrap gap-x-1">
                                                                <span className={g.starter ? 'text-slate-300' : 'opacity-30'}>{g.starter || 'No Starter'}</span> • 
                                                                <span className={g.main ? 'text-slate-300' : 'opacity-30'}>{g.main || 'No Main'}</span> • 
                                                                <span className={g.dessert ? 'text-slate-300' : 'opacity-30'}>{g.dessert || 'No Dessert'}</span>
                                                            </div>
                                                            {g.dietary && <div className="text-red-400 italic mt-1 font-bold flex items-center gap-1"><span className="text-[14px]">⚠️</span> {g.dietary}</div>}
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        )}
                                        <TableVisual table={table} size="small" />
                                        <div className="mt-2 text-[10px] font-black text-slate-400 text-center uppercase tracking-widest">T{table.id}</div>
                                    </div>
                                ))}
                            </div>
                            <div className="flex justify-center mt-6">
                                <p className="bg-white px-4 py-1.5 rounded-full border border-slate-200 text-[10px] font-bold text-slate-500 shadow-sm uppercase tracking-widest">
                                    Drag tables to arrange room • Hover to view service list
                                </p>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
