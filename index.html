<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Manager - Interactive Seating</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { background-color: #f1f5f9; font-family: sans-serif; overflow-x: hidden; scroll-behavior: smooth; }
        .floor-canvas { 
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 30px 30px;
            height: 70vh;
            position: relative;
            border: 2px solid #cbd5e1;
            border-radius: 12px;
            background-color: #f8fafc;
            touch-action: none;
        }
        .draggable-table { cursor: grab; user-select: none; touch-action: none; }
        .draggable-table:active { cursor: grabbing; }
        .guest-dropdown { animation: slideDown 0.2s ease-out; pointer-events: none; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px) translateX(-50%); } to { opacity: 1; transform: translateY(0) translateX(-50%); } }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        .sticky-action-bar {
            position: sticky;
            top: 0;
            z-index: 50;
            background-color: rgba(241, 245, 249, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid #e2e8f0;
        }
        .editable-title {
            border: 1px solid transparent;
            transition: all 0.2s;
            min-width: 400px;
        }
        .editable-title:hover {
            border-bottom: 1px dashed #cbd5e1;
            background-color: rgba(255,255,255,0.5);
        }
        .editable-title:focus {
            background-color: white;
            border: 1px solid #3b82f6;
            outline: none;
            border-radius: 4px;
            padding: 0 8px;
        }

        .guest-label {
            cursor: move;
            transition: transform 0.2s, background-color 0.2s;
        }
        .guest-label:hover {
            background-color: #1d4ed8; 
        }
        .guest-label.dragging {
            opacity: 0.5;
            transform: scale(1.1);
        }
        .guest-label.drag-over {
            border: 2px solid #fbbf24; 
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const STORAGE_KEY_LAYOUT = 'wedding_planner_persistent_layout';
        const STORAGE_KEY_MENU = 'wedding_planner_persistent_menu';
        const STORAGE_KEY_TITLE = 'wedding_planner_persistent_title';
        const STORAGE_KEY_HOLDING = 'wedding_planner_persistent_holding';

        const TableVisual = ({ table, size = "large", onSwapGuests }) => {
            const guests = table.guests || [];
            const isSmall = size === "small";
            const shape = table.shape || 'circular';
            
            let centerX, centerY, a, b;
            let containerClass, innerTableClass;

            // Geometry calculations mapping standard circular nodes cleanly onto rectangles
            if (isSmall) {
                if (shape === 'horizontal') {
                    containerClass = `w-32 h-16 rounded-xl`;
                    innerTableClass = `w-16 h-8 text-[9px] rounded-md`;
                    centerX = 64; centerY = 32;
                    a = 48; b = 22;
                } else if (shape === 'vertical') {
                    containerClass = `w-16 h-32 rounded-xl`;
                    innerTableClass = `w-8 h-16 text-[9px] rounded-md`;
                    centerX = 32; centerY = 64;
                    a = 22; b = 48;
                } else { 
                    containerClass = `w-24 h-24 rounded-full`;
                    innerTableClass = `w-12 h-12 text-[10px] rounded-full`;
                    centerX = 48; centerY = 48;
                    a = 38; b = 38;
                }
            } else {
                if (shape === 'horizontal') {
                    containerClass = `w-64 h-40 rounded-2xl`;
                    innerTableClass = `w-36 h-18 text-base rounded-xl`;
                    centerX = 128; centerY = 80;
                    a = 105; b = 62;
                } else if (shape === 'vertical') {
                    containerClass = `w-40 h-64 rounded-2xl`;
                    innerTableClass = `w-18 h-36 text-base rounded-xl`;
                    centerX = 80; centerY = 128;
                    a = 62; b = 105;
                } else { 
                    containerClass = `w-52 h-52 rounded-full`;
                    innerTableClass = `w-24 h-24 text-base rounded-full`;
                    centerX = 104; centerY = 104;
                    a = 75; b = 75;
                }
            }

            const [draggedIndex, setDraggedIndex] = useState(null);
            const [dragOverIndex, setDragOverIndex] = useState(null);

            const handleDragStart = (e, index) => {
                if (isSmall) return;
                setDraggedIndex(index);
                e.dataTransfer.effectAllowed = "move";
            };

            const handleDragOver = (e, index) => {
                if (isSmall) return;
                e.preventDefault();
                setDragOverIndex(index);
            };

            const handleDrop = (e, targetIndex) => {
                if (isSmall) return;
                e.preventDefault();
                if (draggedIndex !== null && draggedIndex !== targetIndex) {
                    onSwapGuests(table.id, draggedIndex, targetIndex);
                }
                setDraggedIndex(null);
                setDragOverIndex(null);
            };

            const isOverCapacity = guests.filter(g => g.name).length > (table.maxCapacity || 10);

            return (
                <div className={`relative ${containerClass} bg-white border-2 border-dashed ${isOverCapacity ? 'border-red-500 bg-red-50/30' : 'border-slate-300'} flex items-center justify-center shadow-md transition-colors`}>
                    <div className={`${innerTableClass} ${isOverCapacity ? 'bg-red-100 border-red-300' : 'bg-slate-100 border-slate-200'} shadow-inner flex items-center justify-center z-10 border`}>
                        <span className={`font-bold ${isOverCapacity ? 'text-red-600' : 'text-slate-600'}`}>T{table.id}</span>
                    </div>
                    {guests.map((guest, index) => {
                        const angle = (index / guests.length) * 2 * Math.PI - Math.PI / 2;
                        const cos = Math.cos(angle);
                        const sin = Math.sin(angle);
                        
                        let x, y;
                        if (shape === 'circular') {
                            x = centerX + a * cos;
                            y = centerY + b * sin;
                        } else {
                            // Unified Ray intersection stretching formulas to warp circle spacing onto rect perimeters cleanly
                            const rX = Math.abs(cos) > 1e-6 ? a / Math.abs(cos) : Infinity;
                            const rY = Math.abs(sin) > 1e-6 ? b / Math.abs(sin) : Infinity;
                            const r = Math.min(rX, rY);
                            x = centerX + r * cos;
                            y = centerY + r * sin;
                        }
                        
                        return (
                            <div 
                                key={index} 
                                className={`absolute transform -translate-x-1/2 -translate-y-1/2 z-20 ${!isSmall ? 'guest-label' : ''} 
                                    ${draggedIndex === index ? 'dragging' : ''} 
                                    ${dragOverIndex === index ? 'drag-over' : ''}`}
                                style={{ left: `${x}px`, top: `${y}px` }}
                                draggable={!isSmall}
                                onDragStart={(e) => handleDragStart(e, index)}
                                onDragOver={(e) => handleDragOver(e, index)}
                                onDragLeave={() => setDragOverIndex(null)}
                                onDrop={(e) => handleDrop(e, index)}
                            >
                                {!isSmall ? (
                                    <div className="bg-blue-600 text-white px-2 py-0.5 rounded text-[9px] font-semibold shadow-sm whitespace-nowrap select-none">
                                        {guest.name}
                                    </div>
                                ) : (
                                    <div className="w-2 h-2 bg-blue-400 rounded-full border border-white"></div>
                                )}
                            </div>
                        );
                    })}
                </div>
            );
        };

        const App = () => {
            const [view, setView] = useState('input');
            const [hoveredId, setHoveredId] = useState(null);
            const [draggingId, setDraggingId] = useState(null);
            const canvasRef = useRef(null);
            const fileInputRef = useRef(null);

            const [selectedHeldGuestIndex, setSelectedHeldGuestIndex] = useState("");

            const [appTitle, setAppTitle] = useState(() => {
                return localStorage.getItem(STORAGE_KEY_TITLE) || 'Meal Planner';
            });

            const [menu, setMenu] = useState(() => {
                const saved = localStorage.getItem(STORAGE_KEY_MENU);
                return saved ? JSON.parse(saved) : { starters: [""], mains: [""], desserts: [""] };
            });

            const [tables, setTables] = useState(() => {
                const saved = localStorage.getItem(STORAGE_KEY_LAYOUT);
                if (saved) return JSON.parse(saved);
                return [{ id: 1, guests: [], x: 50, y: 50, maxCapacity: 10, shape: 'circular' }];
            });

            const [holdingArea, setHoldingArea] = useState(() => {
                const saved = localStorage.getItem(STORAGE_KEY_HOLDING);
                return saved ? JSON.parse(saved) : [];
            });

            useEffect(() => { localStorage.setItem(STORAGE_KEY_LAYOUT, JSON.stringify(tables)); }, [tables]);
            useEffect(() => { localStorage.setItem(STORAGE_KEY_MENU, JSON.stringify(menu)); }, [menu]);
            useEffect(() => { localStorage.setItem(STORAGE_KEY_TITLE, appTitle); }, [appTitle]);
            useEffect(() => { localStorage.setItem(STORAGE_KEY_HOLDING, JSON.stringify(holdingArea)); }, [holdingArea]);

            const exportBackup = () => {
                const dataString = "data:text/json;charset=utf-8," + encodeURIComponent(
                    JSON.stringify({ title: appTitle, menu, tables, holdingArea })
                );
                const downloadAnchor = document.createElement('a');
                downloadAnchor.setAttribute("href", dataString);
                const safeFileName = `${appTitle.toLowerCase().replace(/[^a-z0-9]/g, '_')}_backup.json`;
                downloadAnchor.setAttribute("download", safeFileName);
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();
            };

            const handleImportFile = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.readAsText(file, "UTF-8");
                reader.onload = (event) => {
                    try {
                        const parsedData = JSON.parse(event.target.result);
                        if (parsedData.title && parsedData.menu && parsedData.tables) {
                            if (window.confirm("This will overwrite your local configuration. Continue?")) {
                                setAppTitle(parsedData.title);
                                setMenu(parsedData.menu);
                                setTables(parsedData.tables.map(t => ({ 
                                    ...t, 
                                    maxCapacity: t.maxCapacity || 10,
                                    shape: t.shape || 'circular' 
                                })));
                                setHoldingArea(parsedData.holdingArea || []);
                                setSelectedHeldGuestIndex("");
                            }
                        } else {
                            alert("Invalid file format.");
                        }
                    } catch (error) {
                        alert("Error parsing file.");
                    }
                };
                e.target.value = ""; 
            };

            const addTable = () => {
                const nextId = tables.length > 0 ? Math.max(...tables.map(t => t.id)) + 1 : 1;
                const newTable = {
                    id: nextId,
                    guests: [],
                    x: 50 + (tables.length * 40) % 400,
                    y: 50 + (tables.length * 40) % 300,
                    maxCapacity: 10,
                    shape: 'circular'
                };
                setTables([...tables, newTable]);
            };

            const removeTable = (id) => {
                if (window.confirm(`Are you sure you want to remove Table ${id}?`)) {
                    setTables(tables.filter(t => t.id !== id));
                }
            };

            const updateTableCapacity = (id, capacity) => {
                setTables(prev => prev.map(t => t.id === id ? { ...t, maxCapacity: parseInt(capacity) || 10 } : t));
            };

            const updateTableShape = (id, shape) => {
                setTables(prev => prev.map(t => t.id === id ? { ...t, shape } : t));
            };

            const jumpToTable = (id) => {
                const element = document.getElementById(`table-card-${id}`);
                if (element) {
                    const offset = 140; 
                    const bodyRect = document.body.getBoundingClientRect().top;
                    const elementRect = element.getBoundingClientRect().top;
                    const elementPosition = elementRect - bodyRect;
                    const offsetPosition = elementPosition - offset;
                    window.scrollTo({ top: offsetPosition, behavior: 'smooth' });
                }
            };

            const handleNameStringChange = (tableId, val) => {
                const names = val.split(',').map(n => n.trim());
                setTables(prev => prev.map(t => {
                    if (t.id !== tableId) return t;
                    const updatedGuests = names.map((name, i) => {
                        const existing = t.guests[i];
                        return {
                            name: name,
                            starter: existing?.starter || "",
                            main: existing?.main || "",
                            dessert: existing?.dessert || "",
                            dietary: existing?.dietary || ""
                        };
                    }).filter((g, i) => i < names.length);
                    return { ...t, guests: updatedGuests };
                }));
            };

            const swapGuests = (tableId, indexA, indexB) => {
                setTables(prev => prev.map(t => {
                    if (t.id !== tableId) return t;
                    const newGuests = [...t.guests];
                    const temp = newGuests[indexA];
                    newGuests[indexA] = newGuests[indexB];
                    newGuests[indexB] = temp;
                    return { ...t, guests: newGuests };
                }));
            };

            const updateGuest = (tableId, gIndex, field, val) => {
                setTables(prev => prev.map(t => {
                    if (t.id !== tableId) return t;
                    const updated = [...t.guests];
                    updated[gIndex] = { ...updated[gIndex], [field]: val };
                    return { ...t, guests: updated };
                }));
            };

            const moveGuestToHolding = (tableId, guestIndex) => {
                const tableTarget = tables.find(t => t.id === tableId);
                if (!tableTarget) return;
                
                const guestToHold = tableTarget.guests[guestIndex];
                if (!guestToHold || !guestToHold.name) return;

                setHoldingArea([...holdingArea, guestToHold]);
                setTables(prev => prev.map(t => {
                    if (t.id !== tableId) return t;
                    return { ...t, guests: t.guests.filter((_, idx) => idx !== guestIndex) };
                }));
            };

            const assignGuestFromHolding = (tableId) => {
                if (selectedHeldGuestIndex === "") return;
                const index = parseInt(selectedHeldGuestIndex);
                const guestToAssign = holdingArea[index];
                if (!guestToAssign) return;

                setTables(prev => prev.map(t => {
                    if (t.id !== tableId) return t;
                    return { ...t, guests: [...t.guests, guestToAssign] };
                }));

                setHoldingArea(prev => prev.filter((_, idx) => idx !== index));
                setSelectedHeldGuestIndex(""); 
            };

            const handlePointerMove = (e) => {
                if (draggingId === null) return;
                const rect = canvasRef.current.getBoundingClientRect();
                
                setTables(prev => prev.map(t => {
                    if (t.id !== draggingId) return t;
                    const tShape = t.shape || 'circular';
                    
                    // Adjust drag anchor dynamically based on the rendered aspect ratios on the floor plan
                    let halfW = 48; 
                    let halfH = 48;
                    if (tShape === 'horizontal') { halfW = 64; halfH = 32; }
                    if (tShape === 'vertical') { halfW = 32; halfH = 64; }

                    return { ...t, x: e.clientX - rect.left - halfW, y: e.clientY - rect.top - halfH };
                }));
            };

            const getTally = () => {
                const totals = { starters: {}, mains: {}, desserts: {}, totalGuests: 0, dietaryNotes: [] };
                tables.forEach(t => {
                    t.guests.forEach(g => {
                        if (!g.name) return;
                        totals.totalGuests++;
                        if (g.starter) totals.starters[g.starter] = (totals.starters[g.starter] || 0) + 1;
                        if (g.main) totals.mains[g.main] = (totals.mains[g.main] || 0) + 1;
                        if (g.dessert) totals.desserts[g.dessert] = (totals.desserts[g.dessert] || 0) + 1;
                        if (g.dietary) totals.dietaryNotes.push(`${g.name} (T${t.id}): ${g.dietary}`);
                    });
                });
                return totals;
            };

            const tally = getTally();

            return (
                <div className="p-6 max-w-7xl mx-auto min-h-screen flex flex-col">
                    <header className="flex flex-col lg:flex-row justify-between items-center mb-6 gap-4 border-b border-slate-200 pb-4">
                        <div className="flex flex-col md:flex-row items-center gap-4 w-full lg:w-auto">
                            <input 
                                className="text-2xl font-bold text-slate-800 font-serif editable-title px-1 w-full md:w-auto"
                                value={appTitle}
                                onChange={(e) => setAppTitle(e.target.value)}
                                placeholder="Event Name..."
                                size="40" 
                            />
                            <div className="flex gap-2 w-full md:w-auto">
                                <button onClick={exportBackup} className="flex-1 md:flex-none text-[10px] uppercase font-black tracking-wider bg-white border text-slate-600 px-3 py-1.5 rounded-lg hover:bg-slate-50 shadow-sm transition-all">💾 Export File</button>
                                <button onClick={() => fileInputRef.current.click()} className="flex-1 md:flex-none text-[10px] uppercase font-black tracking-wider bg-white border text-slate-600 px-3 py-1.5 rounded-lg hover:bg-slate-50 shadow-sm transition-all">📂 Import File</button>
                                <input type="file" ref={fileInputRef} onChange={handleImportFile} accept=".json" className="hidden" />
                            </div>
                        </div>
                        
                        <div className="flex bg-slate-200 p-1 rounded-xl shadow-inner">
                            {['input', 'menu', 'plan', 'summary'].map(v => (
                                <button key={v} onClick={() => setView(v)} className={`px-4 py-2 rounded-lg text-[10px] font-black uppercase transition-all ${view === v ? 'bg-white shadow text-blue-600' : 'text-slate-500'}`}>
                                    {v === 'input' ? 'Guests' : v === 'menu' ? 'Menu' : v === 'plan' ? 'Floor Plan' : 'Summary'}
                                </button>
                            ))}
                        </div>
                    </header>

                    {view === 'menu' && (
                        <div className="grid grid-cols-3 gap-6">
                            {['starters', 'mains', 'desserts'].map(cat => (
                                <div key={cat} className="bg-white p-6 rounded-xl border shadow-sm">
                                    <h2 className="capitalize font-bold mb-4 text-slate-700">{cat}</h2>
                                    {menu[cat].map((item, i) => (
                                        <input key={i} className="w-full p-2 border rounded mb-2 text-sm focus:ring-2 focus:ring-blue-400 outline-none" value={item} onChange={(e) => {
                                            const next = [...menu[cat]]; next[i] = e.target.value;
                                            setMenu({...menu, [cat]: next});
                                        }}/>
                                    ))}
                                    <button onClick={() => setMenu({...menu, [cat]: [...menu[cat], ""]})} className="text-blue-600 text-[10px] font-bold">+ ADD {cat.toUpperCase()}</button>
                                </div>
                            ))}
                        </div>
                    )}

                    {view === 'input' && (
                        <div className="flex-1 pb-20">
                            <div className="sticky-action-bar py-3 px-4 rounded-xl shadow-sm flex flex-col gap-3 mb-8">
                                <div className="flex justify-between items-center w-full">
                                    <div className="flex items-center gap-4">
                                        <select onChange={(e) => jumpToTable(e.target.value)} className="text-xs p-2 border rounded-lg bg-white font-bold text-slate-600 outline-none focus:ring-2 focus:ring-blue-400" value="">
                                            <option value="" disabled>Jump to Table...</option>
                                            {tables.map(t => (
                                                <option key={t.id} value={t.id}>Table {t.id} ({t.guests.filter(g => g.name).length} guests)</option>
                                            ))}
                                        </select>
                                        <button onClick={() => window.scrollTo({top: 0, behavior: 'smooth'})} className="text-[10px] font-bold text-slate-400 hover:text-blue-600 uppercase transition-colors">↑ Top</button>
                                    </div>

                                    <div className="flex items-center gap-6 text-slate-500 italic text-[10px]">
                                        Tip: Click any name chip directly in the clipboard to select them!
                                        <div className="hidden md:block text-[10px] font-black uppercase text-slate-400 tracking-widest not-italic">
                                            Total Guests: <span className="text-blue-600">{tally.totalGuests}</span>
                                        </div>
                                        <button onClick={addTable} className="bg-blue-600 text-white px-5 py-2 rounded-lg text-xs font-bold hover:bg-blue-700 shadow-md transition-all not-italic">
                                            + Add Table
                                        </button>
                                    </div>
                                </div>

                                <div className="bg-slate-100 p-2.5 rounded-lg border border-slate-200 flex flex-wrap items-center gap-3">
                                    <span className="text-[10px] font-black uppercase text-slate-500 tracking-wider">📋 Holding Clipboard:</span>
                                    {holdingArea.length === 0 ? (
                                        <span className="text-xs text-slate-400 italic">No unseated guests. Click 📥 on any guest row to park them here.</span>
                                    ) : (
                                        <div className="flex flex-wrap gap-2 items-center flex-1">
                                            <div className="flex flex-wrap gap-1.5 max-h-24 overflow-y-auto custom-scroll p-0.5">
                                                {holdingArea.map((g, idx) => {
                                                    const isSelected = selectedHeldGuestIndex === String(idx);
                                                    return (
                                                        <button 
                                                            key={idx} 
                                                            onClick={() => setSelectedHeldGuestIndex(String(idx))}
                                                            className={`text-[10px] font-bold px-2.5 py-1 rounded-md shadow-sm transition-all text-left truncate max-w-[120px]
                                                                ${isSelected 
                                                                    ? 'bg-amber-500 text-white ring-2 ring-amber-300 ring-offset-1 font-black scale-105' 
                                                                    : 'bg-amber-100 text-amber-800 border border-amber-200 hover:bg-amber-200'}`}
                                                        >
                                                            {g.name}
                                                        </button>
                                                    );
                                                })}
                                            </div>
                                            <div className="ml-auto flex items-center gap-2">
                                                <select 
                                                    className="text-[10px] font-bold border rounded p-1 bg-white outline-none text-slate-600 focus:ring-2 focus:ring-amber-400"
                                                    value={selectedHeldGuestIndex}
                                                    onChange={(e) => setSelectedHeldGuestIndex(e.target.value)}
                                                >
                                                    <option value="">Choose via dropdown...</option>
                                                    {holdingArea.map((g, idx) => <option key={idx} value={idx}>{g.name}</option>)}
                                                </select>
                                                {selectedHeldGuestIndex !== "" && (
                                                    <button 
                                                        onClick={() => setSelectedHeldGuestIndex("")}
                                                        className="text-[9px] uppercase font-bold text-slate-400 hover:text-slate-600 bg-white border px-1.5 py-1 rounded"
                                                    >
                                                        Clear
                                                    </button>
                                                )}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>

                            <div className="space-y-12">
                                {tables.map(table => {
                                    const seatCount = table.guests.filter(g => g.name).length;
                                    const maxCap = table.maxCapacity || 10;
                                    const isOver = seatCount > maxCap;

                                    return (
                                        <div key={table.id} id={`table-card-${table.id}`} className={`bg-white p-6 rounded-xl border shadow-sm grid grid-cols-1 lg:grid-cols-3 gap-8 relative transition-all ${isOver ? 'border-red-400 bg-red-50/5 hover:border-red-500' : 'hover:border-blue-100'}`}>
                                            <button onClick={() => removeTable(table.id)} className="absolute top-2 right-2 text-slate-300 hover:text-red-500 font-bold text-xl px-2 transition-colors">×</button>
                                            
                                            <div className="lg:col-span-1 border-r pr-8">
                                                <div className="flex justify-between items-start mb-4 gap-2">
                                                    <div>
                                                        <h2 className="font-bold text-lg text-slate-800">Table {table.id}</h2>
                                                        <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${isOver ? 'bg-red-100 text-red-700 animate-pulse' : 'bg-slate-100 text-slate-600'}`}>
                                                            {seatCount} / {maxCap} Seats
                                                        </span>
                                                    </div>
                                                    
                                                    <div className="flex gap-2">
                                                        {/* Shape Selector Field */}
                                                        <div className="text-right">
                                                            <label className="text-[9px] font-black uppercase text-slate-400 block mb-0.5">Shape</label>
                                                            <select
                                                                value={table.shape || 'circular'}
                                                                onChange={(e) => updateTableShape(table.id, e.target.value)}
                                                                className="text-[11px] p-1 border rounded bg-slate-50 font-bold text-slate-700 focus:bg-white focus:ring-2 focus:ring-blue-400 outline-none cursor-pointer"
                                                            >
                                                                <option value="circular">🔵 Circle</option>
                                                                <option value="horizontal">▬ Rectangle (H)</option>
                                                                <option value="vertical">▮ Rectangle (V)</option>
                                                            </select>
                                                        </div>

                                                        <div className="text-right">
                                                            <label className="text-[9px] font-black uppercase text-slate-400 block mb-0.5">Max Seats</label>
                                                            <input 
                                                                type="number" 
                                                                min="1"
                                                                max="20"
                                                                value={maxCap}
                                                                onChange={(e) => updateTableCapacity(table.id, e.target.value)}
                                                                className="w-12 text-center text-xs p-1 border rounded bg-slate-50 font-bold text-slate-700 focus:bg-white focus:ring-2 focus:ring-blue-400 outline-none"
                                                            />
                                                        </div>
                                                    </div>
                                                </div>

                                                <textarea className={`w-full p-3 border rounded h-32 text-sm bg-slate-50 focus:ring-2 outline-none transition-all ${isOver ? 'border-red-300 focus:ring-red-400 bg-red-50/20' : 'focus:ring-blue-400 border-slate-200'}`} value={table.guests.map(g => g.name).join(', ')} onChange={(e) => handleNameStringChange(table.id, e.target.value)} placeholder="Alice, Bob, Charlie..."/>
                                                {isOver && <p className="text-[10px] text-red-600 font-bold mt-1">⚠️ Table capacity exceeded!</p>}
                                                
                                                {selectedHeldGuestIndex !== "" && (
                                                    <button 
                                                        onClick={() => assignGuestFromHolding(table.id)}
                                                        className="w-full mt-3 bg-amber-500 text-white font-bold text-xs py-2 rounded-lg hover:bg-amber-600 shadow transition-colors uppercase tracking-wider"
                                                    >
                                                        📋 Drop {holdingArea[parseInt(selectedHeldGuestIndex)]?.name} Here
                                                    </button>
                                                )}

                                                <div className="flex justify-center mt-6">
                                                    <TableVisual table={table} onSwapGuests={swapGuests} />
                                                </div>
                                            </div>
                                            
                                            <div className="lg:col-span-2 space-y-2">
                                                {table.guests.map((g, i) => (
                                                    <div key={i} className="flex gap-2 items-center bg-white p-2 rounded border shadow-sm">
                                                        <button 
                                                            onClick={() => moveGuestToHolding(table.id, i)}
                                                            title="Move guest to holding clipboard"
                                                            className="text-slate-400 hover:text-amber-600 font-bold text-xs p-1 rounded hover:bg-amber-50 transition-colors"
                                                        >
                                                            📥
                                                        </button>
                                                        <span className="w-24 text-[11px] font-bold text-slate-700 truncate">{g.name || `Guest ${i+1}`}</span>
                                                        {['starter', 'main', 'dessert'].map(course => (
                                                            <select key={course} className="text-[10px] p-1 border rounded w-28 bg-slate-50" value={g[course]} onChange={(e) => updateGuest(table.id, i, course, e.target.value)}>
                                                                <option value="">{course}...</option>
                                                                {menu[course + 's'].filter(m => m).map(m => <option key={m} value={m}>{m}</option>)}
                                                            </select>
                                                        ))}
                                                        <input className="flex-1 text-[10px] p-1 border rounded" placeholder="Dietary..." value={g.dietary} onChange={(e) => updateGuest(table.id, i, 'dietary', e.target.value)}/>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    )}

                    {view === 'plan' && (
                        <div className="flex-1 relative">
                            <div ref={canvasRef} className="floor-canvas" onPointerMove={handlePointerMove} onPointerUp={() => setDraggingId(null)}>
                                {tables.map(table => {
                                    const isOver = table.guests.filter(g => g.name).length > (table.maxCapacity || 10);
                                    return (
                                        <div key={table.id} onPointerDown={() => setDraggingId(table.id)} onMouseEnter={() => !draggingId && setHoveredId(table.id)} onMouseLeave={() => setHoveredId(null)} className="absolute draggable-table" style={{ left: `${table.x}px`, top: `${table.y}px`, zIndex: hoveredId === table.id ? 100 : 10 }}>
                                            {hoveredId === table.id && table.guests.some(g => g.name) && (
                                                <div className="guest-dropdown absolute top-full left-1/2 mt-2 w-64 bg-slate-900 text-white rounded-lg p-3 z-[110] shadow-2xl">
                                                    <div className="absolute w-2 h-2 bg-slate-900 rotate-45 left-1/2 -top-1 -translate-x-1/2"></div>
                                                    {isOver && <div className="text-[10px] text-red-400 font-black tracking-wide mb-1">⚠️ OVER CAPACITY ({table.guests.filter(g => g.name).length}/{table.maxCapacity || 10})</div>}
                                                    {table.guests.filter(g => g.name).map((g, i) => (
                                                        <div key={i} className="mb-2 text-[10px] border-b border-slate-800 pb-1 last:border-0">
                                                            <div className="font-bold text-blue-400">{g.name}</div>
                                                            <div className="text-slate-400 truncate">{g.starter || '—'}, {g.main || '—'}, {g.dessert || '—'}</div>
                                                            {g.dietary && <div className="text-red-400 font-bold">⚠️ {g.dietary}</div>}
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                            {/* Render small aspect ratio accurate structures on floor canvas mapping custom shapes perfectly */}
                                            <TableVisual table={table} size="small" />
                                            {isOver && <div className="absolute top-0 right-0 bg-red-500 text-white rounded-full w-4 h-4 flex items-center justify-center text-[9px] font-bold shadow animate-bounce">!</div>}
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    )}

                    {view === 'summary' && (
                        <div className="flex-1 space-y-6 pb-20">
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div className="bg-white p-6 rounded-xl border shadow-sm">
                                    <h2 className="font-bold text-slate-800 mb-4 border-b pb-2">Kitchen Count (Total: {tally.totalGuests})</h2>
                                    <div className="space-y-4">
                                        {['starters', 'mains', 'desserts'].map(cat => (
                                            <div key={cat}>
                                                <h3 className="capitalize text-xs font-black text-slate-400 mb-2">{cat}</h3>
                                                {Object.entries(tally[cat]).map(([name, count]) => (
                                                    <div key={name} className="flex justify-between text-sm py-1 border-b border-slate-50">
                                                        <span>{name}</span><span className="font-bold">{count}</span>
                                                    </div>
                                                ))}
                                            </div>
                                        ))}
                                    </div>
                                    <h2 className="font-bold text-slate-800 mt-6 mb-4 border-b pb-2 text-red-600">Dietary Alerts</h2>
                                    <ul className="text-xs space-y-1">
                                        {tally.dietaryNotes.map((note, i) => <li key={i} className="bg-red-50 p-2 rounded border border-red-100">{note}</li>)}
                                    </ul>
                                </div>
                                <div className="bg-white p-6 rounded-xl border shadow-sm">
                                    <h2 className="font-bold text-slate-800 mb-4 border-b pb-2 tracking-tight">Export Data (# Separated)</h2>
                                    <p className="text-[10px] text-slate-500 mb-4 italic">Copy and paste this into Excel or Google Sheets. Use "Split Text to Columns" with # as the delimiter.</p>
                                    <textarea readOnly className="w-full h-96 p-4 bg-slate-50 border rounded font-mono text-[10px]" value={
                                        "Table#Name#Starter#Main#Dessert#Dietary\n" + 
                                        tables.flatMap(t => t.guests.filter(g => g.name).map(g => `${t.id}#${g.name}#${g.starter}#${g.main}#${g.dessert}#${g.dietary}`)).join("\n")
                                    }/>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
